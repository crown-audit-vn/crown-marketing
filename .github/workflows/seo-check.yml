name: SEO check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  seo-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run seo:check
      - run: npm run test:locale-path